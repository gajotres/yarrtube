name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through tagging or releasing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  openspec-archived:
    name: OpenSpec changes archived
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OpenSpec changes are archived
        run: |
          extra=$(find openspec/changes -mindepth 1 -maxdepth 1 ! -name archive)
          if [ -n "$extra" ]; then
            echo "Unarchived OpenSpec changes found (run 'opsx:archive' before merging):"
            echo "$extra"
            exit 1
          fi

  ci:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e-tests/package-lock.json

      - name: Install web UI dependencies and build it
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install end-to-end test dependencies and browsers
        run: |
          npm --prefix e2e-tests ci
          npx --prefix e2e-tests playwright install --with-deps chromium webkit

      # The image the end-to-end suite tests, built once with its layers
      # cached between runs, and handed to the suite as E2E_IMAGE.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yarrtube:e2e-ci
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max

      # The same script developers run locally; in CI it leaves out the
      # YouTube contract tests, which need the real YouTube. Without a
      # YouTube API key the end-to-end suite skips its upgrade check too.
      - name: Run tests
        env:
          E2E_IMAGE: yarrtube:e2e-ci
        run: scripts/run-tests.sh --ci

      - name: Upload end-to-end results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tests-results
          path: e2e-tests/test-results
          retention-days: 7

  # Every merge to main that passes CI gets the next vX.Y.Z tag (see
  # scripts/next-release-tag.sh) and is released.
  tag:
    name: Tag release
    needs: [openspec-archived, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: next
        run: echo "tag=$(scripts/next-release-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      channel: release
      tag: ${{ needs.tag.outputs.tag }}
